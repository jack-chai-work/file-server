[package]
name = "tauri-ftp-server"
version = "0.1.0"
description = "轻型 FTP + HTTP 文件服务器"
authors = ["Local"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tauri_ftp_server_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "sync", "time"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
percent-encoding = "2"
dirs = "6"
rfd = "0.15"
